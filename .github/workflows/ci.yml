name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit + offline integration)
        run: cargo test

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Extract the policy URLs from README.md itself (not a hand-maintained
      # list) so the checked set cannot drift from the README.
      - name: Check policy links
        run: |
          set -euo pipefail
          # Placeholder example URLs (config template samples) are skipped.
          grep -oE 'https://(foundation\.wikimedia\.org|www\.mediawiki\.org|wikitech\.wikimedia\.org|en\.wikipedia\.org|meta\.wikimedia\.org|blueoakcouncil\.org|dumps\.wikimedia\.org|github\.com/tieguy/wm-fetch)[^) "]*' README.md \
            | grep -v 'User:YourName' | sort -u > /tmp/links.txt
          test -s /tmp/links.txt
          fail=0
          while read -r url; do
            if ! curl -fsSI --max-time 30 "$url" > /dev/null; then
              echo "DEAD LINK: $url"
              fail=1
            fi
          done < /tmp/links.txt
          cat /tmp/links.txt
          exit $fail
