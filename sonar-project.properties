sonar.projectKey=tieguy_wm-fetch
sonar.organization=tieguy

# Rust analysis: metrics/complexity on sources, tests tracked separately.
sonar.sources=src,build.rs
sonar.tests=tests

# Clippy findings are imported from the report generated in CI
# (cargo clippy --all-targets --message-format=json); the scanner does
# not run Clippy itself.
sonar.rust.clippyReport.reportPaths=clippy-report.json
